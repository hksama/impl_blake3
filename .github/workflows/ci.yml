name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: ${{ matrix.job }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - job: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_tests: true

          - job: Linux x86
            os: ubuntu-latest
            target: i686-unknown-linux-gnu
            run_tests: true
            apt_packages: gcc-multilib
            rustflags: -C link-arg=-m32

          - job: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            run_tests: true

          # macOS
          - job: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            run_tests: false

          - job: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            run_tests: true

          # Windows
          - job: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            run_tests: true

          - job: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            run_tests: true

          - job: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            run_tests: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Configure Rust flags
        if: matrix.rustflags != ''
        run: echo "RUSTFLAGS=${{ matrix.rustflags }}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --target ${{ matrix.target }} --verbose

      - name: Test
        if: matrix.run_tests
        run: cargo test --target ${{ matrix.target }} --verbose

      - name: Compile tests (cross-target)
        if: "!matrix.run_tests"
        run: cargo test --target ${{ matrix.target }} --no-run --verbose
